# Builds the native launchers and napi addon for every published target, then
# installs the actual npm tarballs on the platforms GitHub can execute natively.
# Actions are pinned to commit SHAs (tag in the trailing comment); tool versions are pinned
# in env below.
name: napi

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "crates/**"
      - "packages/fuck-npm-binding/**"
      - "packages/fuck-npm/src/core/**"
      - "packages/fuck-npm/bin/**"
      - "packages/fuck-npm/lib/**"
      - "packages/fuck-npm/scripts/**"
      - "scripts/**"
      - "packages/fuck-npm/tests/unit/core/native.test.ts"
      - "Cargo.toml"
      - "Cargo.lock"
      - "package-lock.json"
      - ".github/workflows/napi.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: napi-${{ github.ref }}
  cancel-in-progress: true

env:
  RUST_TOOLCHAIN: "1.99.1"
  NODE_VERSION: "24"
  ZIG_VERSION: "0.15.2"
  CARGO_ZIGBUILD_VERSION: "0.24.0"
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, host: macos-latest }
          - { target: x86_64-apple-darwin, host: macos-latest }
          # Keep glibc 2.17 compatibility. The bundled ARM GCC is too old for libdeflate,
          # so ARM uses Zig with an explicit glibc baseline.
          - { target: x86_64-unknown-linux-gnu, build_target: x86_64-unknown-linux-gnu.2.17, host: ubuntu-latest, flags: -x, zig: true }
          - { target: aarch64-unknown-linux-gnu, build_target: aarch64-unknown-linux-gnu.2.17, host: ubuntu-latest, flags: -x, zig: true }
          - { target: x86_64-unknown-linux-musl, host: ubuntu-latest, flags: -x, zig: true }
          - { target: aarch64-unknown-linux-musl, host: ubuntu-latest, flags: -x, zig: true }
          - { target: x86_64-pc-windows-msvc, host: windows-latest }
          - { target: aarch64-pc-windows-msvc, host: windows-latest }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: napi-${{ matrix.target }}
      - if: matrix.zig
        uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - if: matrix.zig
        run: cargo install cargo-zigbuild --version "$CARGO_ZIGBUILD_VERSION" --locked
        shell: bash
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: napi build
        working-directory: packages/fuck-npm-binding
        shell: bash
        env:
          # zig passes its baseline CPU's features explicitly, including -evex512, so
          # libdeflate's AVX-512 functions (target attributes without evex512) fail to compile.
          CFLAGS_x86_64_unknown_linux_musl: -mevex512
          CFLAGS_x86_64_unknown_linux_gnu: -mevex512
        run: >
          npx napi build --platform --profile release-napi --target "${{ matrix.build_target || matrix.target }}"
          ${{ matrix.flags }}
          --manifest-path ../../crates/fnpm-napi/Cargo.toml --output-dir . --no-js
      - name: Build and collect native launchers
        shell: bash
        env:
          CFLAGS_x86_64_unknown_linux_musl: -mevex512
          CFLAGS_x86_64_unknown_linux_gnu: -mevex512
        run: |
          if [[ "${{ matrix.zig }}" == "true" ]]; then
            cargo zigbuild --release --locked -j 4 -p fnpm-cli --bins --target "${{ matrix.build_target || matrix.target }}"
          else
            cargo build --release --locked -j 4 -p fnpm-cli --bins --target "${{ matrix.target }}"
          fi
          suffix=""
          if [[ "${{ matrix.target }}" == *windows* ]]; then suffix=".exe"; fi
          cp "target/${{ matrix.target }}/release/fnpm${suffix}" packages/fuck-npm-binding/
          cp "target/${{ matrix.target }}/release/fnpm-lock${suffix}" packages/fuck-npm-binding/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binding-${{ matrix.target }}
          path: |
            packages/fuck-npm-binding/fnpm.*.node
            packages/fuck-npm-binding/fnpm
            packages/fuck-npm-binding/fnpm-lock
            packages/fuck-npm-binding/fnpm.exe
            packages/fuck-npm-binding/fnpm-lock.exe
          if-no-files-found: error
          retention-days: 7

  test:
    name: test ${{ matrix.host }} node ${{ matrix.node }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        host: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
        node: ["24"]
        include:
          - { host: ubuntu-latest, node: "20" }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: napi-test
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: cargo test -p fnpm-store -p fnpm-napi
      - run: cargo test -p fnpm-core ancestor_materialization
      - run: cargo test -p fnpm-core spec::tests
      - if: runner.os == 'macOS'
        run: cargo test -p fnpm-linker clone_dir_preserves_source_symlinks
      - run: cargo clippy -p fnpm-store -p fnpm-napi --all-targets --features fnpm-napi/testing -- -D warnings
      # Debug build with the `testing` exports the vitest suite drives.
      - run: npm run build:native:test -w @fuck-npm/binding
      - run: npm test -w @fuck-npm/binding
      # The CLI's Core over this build: its options deserialize in Rust, events, error codes.
      - run: npx vitest run tests/unit/core/native.test.ts
        working-directory: packages/fuck-npm

  # Loads each release artifact on its own platform and makes real calls into the core
  # (tests/smoke.cjs). GitHub has no musl runner, so musl builds run in Alpine.
  smoke:
    name: smoke ${{ matrix.target }}
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: aarch64-apple-darwin, host: macos-latest }
          - { target: x86_64-apple-darwin, host: macos-15-intel }
          - { target: x86_64-unknown-linux-gnu, host: ubuntu-latest }
          - { target: aarch64-unknown-linux-gnu, host: ubuntu-24.04-arm }
          - { target: x86_64-unknown-linux-musl, host: ubuntu-latest, alpine: true }
          - { target: aarch64-unknown-linux-musl, host: ubuntu-24.04-arm, alpine: true }
          - { target: x86_64-pc-windows-msvc, host: windows-latest }
          - { target: aarch64-pc-windows-msvc, host: windows-11-arm }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: binding-${{ matrix.target }}
          path: artifacts/binding-${{ matrix.target }}
      - if: ${{ !matrix.alpine }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - if: ${{ !matrix.alpine }}
        shell: bash
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run build -w fuck-npm
          cp artifacts/binding-${{ matrix.target }}/fnpm.*.node packages/fuck-npm-binding/
          node packages/fuck-npm-binding/tests/smoke.cjs
          node scripts/stage-release.mjs --name @fnpm-ci/fuck-npm --target "${{ matrix.target }}" --artifacts artifacts --out release-smoke
          node scripts/pack-release.mjs release-smoke
          node scripts/smoke-release.mjs release-smoke
      - if: matrix.alpine
        run: >
          docker run --rm -v "$PWD:/w" -w /w
          node:${{ env.NODE_VERSION }}-alpine sh -ec '
          npm ci --ignore-scripts --no-audit --no-fund &&
          npm run build -w fuck-npm &&
          cp artifacts/binding-${{ matrix.target }}/fnpm.*.node packages/fuck-npm-binding/ &&
          node packages/fuck-npm-binding/tests/smoke.cjs &&
          node scripts/stage-release.mjs --name @fnpm-ci/fuck-npm --target "${{ matrix.target }}" --artifacts artifacts --out release-smoke &&
          node scripts/pack-release.mjs release-smoke &&
          node scripts/smoke-release.mjs release-smoke'
