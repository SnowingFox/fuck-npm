    resolution: {integrity: sha512-react==}

  typescript@4.9.5:
    resolution: {integrity: sha512-ts4==}

  typescript@5.3.3:
    resolution: {integrity: sha512-ts5==}

  eslint@8.56.0:
    resolution: {integrity: sha512-eslint==}

  fsevents@2.3.3:
    resolution: {integrity: sha512-fsevents==}
    engines: {node: ^8.16.0 || ^10.6.0 || >=11.0.0}
    os: [darwin]
    requiresBuild: true
    optional: true

snapshots:
  react@18.2.0: {}
  typescript@4.9.5: {}
  typescript@5.3.3: {}
  eslint@8.56.0: {}
  fsevents@2.3.3:
    optional: true