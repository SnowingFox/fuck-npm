lockfileVersion: '9.0'

importers:
  .:
    dependencies:
      react:
        specifier: ^18.2.0
        version: 18.2.0
      typescript:
        specifier: ^4.0.0
        version: 4.9.5
    devDependencies:
      typescript:
        specifier: ^5.3.3
        version: 5.3.3
      eslint:
        specifier: ^8.56.0
        version: 8.56.0
    optionalDependencies:
      fsevents:
        specifier: ^2.3.3
        version: 2.3.3

packages:
