lockfileVersion: '9.0'

importers:
  .:
    dependencies:
      '@workspace/pkg1':
        specifier: workspace:*
        version: link:packages/pkg1

  packages/pkg1:
    dependencies:
      '@workspace/pkg2':
        specifier: workspace:*
        version: link:../pkg2
      lodash:
        specifier: ^4.17.21
        version: 4.17.21

  packages/pkg2:
    dependencies:
      '@workspace/pkg3':
        specifier: workspace:*
        version: link:../pkg3

  packages/pkg3:
    dependencies:
      '@workspace/pkg1':
        specifier: workspace:*
        version: link:../pkg1

packages:
  lodash@4.17.21:
    resolution: {integrity: sha512-lodash==}

snapshots:
  lodash@4.17.21: {}