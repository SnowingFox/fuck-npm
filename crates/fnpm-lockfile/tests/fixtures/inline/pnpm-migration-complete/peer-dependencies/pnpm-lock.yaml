lockfileVersion: '9.0'

settings:
  autoInstallPeers: false

importers:
  .:
    dependencies:
      react:
        specifier: ^18.2.0
        version: 18.2.0
      react-dom:
        specifier: ^18.2.0
        version: 18.2.0(react@18.2.0)
      '@mui/material':
        specifier: ^5.15.0
        version: 5.15.0(@emotion/react@11.11.3)(@emotion/styled@11.11.0)(react-dom@18.2.0)(react@18.2.0)

packages:
  react@18.2.0:
    resolution: {integrity: sha512-react==}

  react-dom@18.2.0:
    resolution: {integrity: sha512-reactdom==}
    peerDependencies:
      react: ^18.2.0

  '@mui/material@5.15.0':
    resolution: {integrity: sha512-mui==}
    peerDependencies:
      '@emotion/react': ^11.5.0
      '@emotion/styled': ^11.3.0
      react: ^17.0.0 || ^18.0.0
      react-dom: ^17.0.0 || ^18.0.0
    peerDependenciesMeta:
      '@emotion/react':
        optional: true
      '@emotion/styled':
        optional: true

  '@emotion/react@11.11.3':
    resolution: {integrity: sha512-emotion-react==}
    peerDependencies:
      react: '>=16.8.0'

  '@emotion/styled@11.11.0':
    resolution: {integrity: sha512-emotion-styled==}
    peerDependencies:
      '@emotion/react': ^11.0.0
      react: '>=16.8.0'

snapshots:
  react@18.2.0: {}

  react-dom@18.2.0(react@18.2.0):
    dependencies:
      react: 18.2.0

  '@mui/material@5.15.0(@emotion/react@11.11.3)(@emotion/styled@11.11.0)(react-dom@18.2.0)(react@18.2.0)':
    dependencies:
      react: 18.2.0
      react-dom: 18.2.0(react@18.2.0)
    optionalDependencies:
      '@emotion/react': 11.11.3(react@18.2.0)
      '@emotion/styled': 11.11.0(@emotion/react@11.11.3)(react@18.2.0)

  '@emotion/react@11.11.3(react@18.2.0)':
    dependencies:
      react: 18.2.0

  '@emotion/styled@11.11.0(@emotion/react@11.11.3)(react@18.2.0)':
    dependencies:
      '@emotion/react': 11.11.3(react@18.2.0)
      react: 18.2.0