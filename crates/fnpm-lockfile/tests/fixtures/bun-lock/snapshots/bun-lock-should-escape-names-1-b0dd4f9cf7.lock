{
  "lockfileVersion": 2,
  "configVersion": 1,
  "workspaces": {
    "": {
      "name": "quote-in-dependency-name",
    },
    "packages/\"": {
      "name": "\"",
    },
    "packages/pkg1": {
      "name": "pkg1",
      "dependencies": {
        "\"": "*",
      },
    },
  },
  "packages": {
    "\"": ["\"@workspace:packages/\""],

    "pkg1": ["pkg1@workspace:packages/pkg1"],
  }
}
