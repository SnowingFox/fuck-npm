[package]
name = "fnpm-cli"
description = "The native fnpm and fnpm-lock launchers"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

[[bin]]
name = "fnpm"
path = "src/bin/fnpm.rs"

[[bin]]
name = "fnpm-lock"
path = "src/bin/fnpm-lock.rs"

[dependencies]
fnpm-core.workspace = true
fnpm-types.workspace = true
fnpm-config.workspace = true
mimalloc.workspace = true
libmimalloc-sys.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["signal"] }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["termios"] }
libc.workspace = true

[build-dependencies]
serde_json.workspace = true

[dev-dependencies]
tempfile.workspace = true
