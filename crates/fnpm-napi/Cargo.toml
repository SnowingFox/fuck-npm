[package]
name = "fnpm-napi"
description = "Node-API bindings for the fnpm core"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish = false

[lib]
crate-type = ["cdylib"]

[features]
# Extra `__test*` exports used by packages/fuck-npm-binding's vitest suite. Never enabled
# for release builds.
testing = []

[dependencies]
napi.workspace = true
napi-derive.workspace = true
fnpm-core.workspace = true
fnpm-types.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures-util.workspace = true
mimalloc.workspace = true

[build-dependencies]
napi-build.workspace = true
